[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lazyrtui"
version = "0.1.0"
description = "A terminal user interface for ROS 2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.40.0",
    "plotext>=5.0.0",
    "pyyaml>=6.0"
]

[project.scripts]
lazyrtui = "lazyrtui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
